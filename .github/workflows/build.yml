name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: |
          chmod +x gradlew
          set +e
          ./gradlew assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          tail -n 80 build.log
          if [ $code -ne 0 ]; then
            ( grep -E "^e: " build.log; grep -vE "^> Task|^e: " build.log | grep -E "error:|ERROR:|What went wrong|Could not|^> " ) | head -n 9 | while IFS= read -r line; do
              echo "::error::${line}"
            done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: AviationWeather-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as a release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AviationWeather.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest AviationWeather.apk --title "Aviation Weather (latest build)" --notes "Built from ${GITHUB_SHA}"
